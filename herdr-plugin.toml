id = "frega.cass"
name = "Cass"
version = "0.1.0"
min_herdr_version = "0.8.0"
description = "Search all your coding-agent sessions with cass and resume a hit in a new herdr tab."
platforms = ["linux", "macos"]

[[actions]]
id = "search"
title = "Cass: search sessions"
command = ["python3", "bin/herdr-cass", "open-search"]

[[panes]]
id = "search"
title = "Search sessions"
placement = "popup"
width = "80%"
height = 20
command = ["python3", "bin/herdr-cass", "search"]
